<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator Notifikasi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#2b3a42;--card:#1e262c;--text:#fff;--sub:#b9c2c8;--blue:#0a8dff;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#3a4147,var(--bg));color:var(--text);font-family:"Roboto","Segoe UI",system-ui,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:32px 18px}
h1{font-size:26px;font-weight:500;margin:8px 0 6px}
p{color:var(--sub);line-height:1.5;margin:0 0 18px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:16px}
button{font:inherit;border:0;border-radius:18px;cursor:pointer}
.main{width:100%;padding:16px;background:var(--blue);color:#fff;font-size:17px;font-weight:500}
.main:disabled{opacity:.6}
.status{margin-top:12px;font-size:14px;color:var(--sub);min-height:20px}
label{font-size:14px;color:var(--sub)}
input{width:100%;margin:8px 0 10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font:inherit;font-size:20px}
input:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hasil{font-size:40px;font-weight:300;text-align:right;min-height:52px;word-break:break-all}
.hasil.err{font-size:18px;color:#ff9b9b;padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kalkulator Notifikasi</h1>
  <p>Setelah diaktifkan, kalkulator muncul di bar notifikasi HP. Setiap kali web ini dibuka, notifnya dimunculkan lagi.</p>

  <div class="card">
    <button class="main" id="aktif">Aktifkan notifikasi</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <label for="in">Kalkulator di halaman</label>
    <input id="in" inputmode="decimal" autocomplete="off" placeholder="12+5*3">
    <div class="hasil" id="out">0</div>
  </div>
</div>

<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var st = $('status'), btn = $('aktif');

  /* Kalkulator di halaman */
  function hitung(s) {
    var t = String(s).replace(/[x×]/gi, '*').replace(/[÷:]/g, '/').replace(/,/g, '.').replace(/%/g, '/100').replace(/\s+/g, '');
    if (!t) return { kosong: true };
    if (!/^[0-9+\-*/.()]+$/.test(t)) return { err: true };
    t = t.replace(/[+\-*/.]+$/, '');
    try {
      var v = Function('"use strict";return (' + t + ')')();
      if (typeof v !== 'number' || !isFinite(v)) return { err: true };
      return { v: Math.round(v * 1e10) / 1e10 };
    } catch (e) { return { err: true }; }
  }
  $('in').addEventListener('input', function () {
    var r = hitung(this.value), o = $('out');
    o.classList.remove('err');
    if (r.kosong) o.textContent = '0';
    else if (r.err) { o.textContent = 'Hitungan tidak valid'; o.classList.add('err'); }
    else o.textContent = String(r.v).replace('.', ',');
  });

  /* Notifikasi */
  var reg = null;
  function tampil() {
    if (!reg) return;
    if (reg.active) reg.active.postMessage({ type: 'tampil' });
    else navigator.serviceWorker.ready.then(function (r) { r.active.postMessage({ type: 'tampil' }); });
  }
  function siap() {
    btn.textContent = 'Munculkan notifikasi lagi';
    btn.disabled = false;
    st.textContent = 'Notifikasi aktif. Cek bar notifikasi HP kamu, lalu ketuk "Hitung".';
    tampil();
  }

  if (!('serviceWorker' in navigator) || !('Notification' in window)) {
    btn.disabled = true;
    st.textContent = 'Browser ini tidak mendukung notifikasi web. Pakai Chrome di Android.';
    return;
  }
  if (!window.isSecureContext) {
    btn.disabled = true;
    st.textContent = 'Notifikasi butuh alamat HTTPS. Upload file ini ke hosting yang memakai https://.';
    return;
  }

  navigator.serviceWorker.register('sw.js').then(function (r) {
    reg = r;
    if (Notification.permission === 'granted') {
      navigator.serviceWorker.ready.then(function () { siap(); });
    } else if (Notification.permission === 'denied') {
      btn.disabled = true;
      st.textContent = 'Izin notifikasi diblokir. Buka pengaturan situs di Chrome, lalu izinkan notifikasi.';
    }
  }).catch(function () {
    btn.disabled = true;
    st.textContent = 'Gagal memuat sw.js. Pastikan sw.js ada di folder yang sama dengan index.html.';
  });

  btn.addEventListener('click', function () {
    if (Notification.permission === 'granted') { siap(); return; }
    Notification.requestPermission().then(function (p) {
      if (p === 'granted') siap();
      else st.textContent = 'Izin notifikasi tidak diberikan.';
    });
  });
})();
</script>
</body>
</html>
